<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:#ff4d88;
    font-size:24px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    to{
        transform:translateY(-120vh);
        opacity:1;
    }
}

.container{
    position:relative;
    z-index:2;
    background:rgba(255,255,255,0.9);
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    max-width:350px;
}

h1{
    color:#ff3366;
    margin-bottom:20px;
    font-size:36px;
}

p{
    color:#444;
    font-size:22px;
    line-height:1.6;
}
</style>
</head>
<body>

<div class="container">
    <h1>Hi Jirelz</h1>
    <p>
        Ikaw pa rin hanggang ngayon.<br><br>
        Sana aware ka. 🫶🏻
    </p>
</div>

<script>
// Floating Hearts
for(let i=0;i<50;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(5+Math.random()*5)+"s";
    heart.style.fontSize=(15+Math.random()*20)+"px";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
