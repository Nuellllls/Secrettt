<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jirelz ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:#ff3366;
    font-size:25px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    to{
        transform:translateY(-120vh);
        opacity:1;
    }
}

.container{
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    z-index:2;
}

h1{
    color:#ff3366;
    margin-bottom:20px;
}

button{
    border:none;
    padding:15px 30px;
    margin:10px;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

#yes{
    background:#ff4d88;
    color:white;
}

#no{
    background:#666;
    color:white;
}

button:hover{
    transform:scale(1.1);
}

#message{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">
    <h1>Hi Jirelz ❤️</h1>
    <p style="margin-bottom:20px;">May gusto lang akong itanong...</p>

    <button id="yes" onclick="yesAnswer()">Ako pa ba? 💖</button>
    <button id="no" onclick="noAnswer()">May iba na? 💔</button>

    <div id="message"></div>
</div>

<script>
// Create Floating Hearts
for(let i=0;i<40;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(4+Math.random()*6)+"s";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    document.body.appendChild(heart);
}

function yesAnswer(){
    document.getElementById("message").innerHTML=
    "🥹💖 Thank you... Sobrang saya ko. Sana ikaw pa rin at tayo pa rin hanggang dulo. ❤️";
}

function noAnswer(){
    document.getElementById("message").innerHTML=
    "💔 Kahit masakit, igagalang ko ang nararamdaman mo. Salamat sa lahat ng masasayang alaala. Ingat ka palagi. 🌹";
}
</script>

</body>
</html>
